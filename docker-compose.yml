name: spe-calculator

services:
  calculator:
    image: ${CALCULATOR_IMAGE:-local/spe-calculator:dev}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - calculator-network
    restart: unless-stopped
    stop_grace_period: 30s

  proxy:
    image: local/spe-calculator-proxy:dev
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      calculator:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8082}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - calculator-network
      - proxy-network
    restart: unless-stopped

networks:
  calculator-network:
    driver: bridge
    internal: true
  proxy-network:
    driver: bridge
